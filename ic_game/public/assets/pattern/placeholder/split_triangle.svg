<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <pattern id="hatch-triangle" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    </pattern>
  </defs>
  <!-- Left half triangle (Blue + White diagonal hatch stripes) -->
  <polygon points="64,20 18,108 64,108" fill="#1d4ed8"/>
  <polygon points="64,20 18,108 64,108" fill="url(#hatch-triangle)"/>
  <!-- Right half triangle (Warm Amber solid) -->
  <polygon points="64,20 110,108 64,108" fill="#f59e0b"/>
  <!-- Outer border & center divider -->
  <polygon points="64,20 110,108 18,108" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#0f172a" stroke-width="2.5"/>
</svg>
