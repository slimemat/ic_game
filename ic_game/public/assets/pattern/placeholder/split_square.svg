<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <pattern id="hatch-square" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    </pattern>
  </defs>
  <!-- Left half (Blue + White diagonal hatch stripes) -->
  <path d="M 22,22 L 64,22 L 64,106 L 22,106 Z" fill="#1d4ed8"/>
  <path d="M 22,22 L 64,22 L 64,106 L 22,106 Z" fill="url(#hatch-square)"/>
  <!-- Right half (Warm Amber solid) -->
  <path d="M 64,22 L 106,22 L 106,106 L 64,106 Z" fill="#f59e0b"/>
  <!-- Outer border & center divider -->
  <rect x="22" y="22" width="84" height="84" rx="4" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="64" y1="22" x2="64" y2="106" stroke="#0f172a" stroke-width="2.5"/>
</svg>
