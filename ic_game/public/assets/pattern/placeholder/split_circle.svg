<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <pattern id="hatch-circle" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    </pattern>
  </defs>
  <!-- Left semicircle (Blue + White diagonal hatch stripes) -->
  <path d="M 64,20 A 44,44 0 0,0 64,108 Z" fill="#1d4ed8"/>
  <path d="M 64,20 A 44,44 0 0,0 64,108 Z" fill="url(#hatch-circle)"/>
  <!-- Right semicircle (Warm Amber solid) -->
  <path d="M 64,20 A 44,44 0 0,1 64,108 Z" fill="#f59e0b"/>
  <!-- Outer circle & center divider -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line x1="64" y1="20" x2="64" y2="108" stroke="#0f172a" stroke-width="2.5"/>
</svg>
